<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | Son Jiwon</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f5f7;
      --surface: #ffffff;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --soft: #9aa3ad;
      --line: rgba(0, 0, 0, 0.08);
      --line-strong: rgba(0, 0, 0, 0.14);
      --yonsei: #003876;
      --kict: #f29a16;
      --velog: #12b886;
      --naver: #03c75a;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Noto Sans KR", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(245, 245, 247, 0.82);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      backdrop-filter: saturate(180%) blur(18px);
    }

    .header-inner {
      width: min(1120px, calc(100% - 44px));
      height: 48px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      width: 38px;
      height: 38px;
      display: inline-grid;
      place-items: center;
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 50%;
      background: #fff;
      color: var(--yonsei);
      line-height: 1;
    }

    .brand svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 24px;
      color: #424245;
      font-size: 0.78rem;
      line-height: 1;
      white-space: nowrap;
    }

    .nav a {
      opacity: 0.92;
      transition: color 160ms ease, opacity 160ms ease;
    }

    .nav a[aria-current="page"],
    .nav a:hover,
    .nav a:focus-visible {
      color: var(--yonsei);
      opacity: 1;
      outline: none;
    }

    main {
      padding: 82px 22px 110px;
    }

    .blog-shell {
      width: min(1120px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 42px;
    }

    .blog-hero {
      display: grid;
      gap: 18px;
      max-width: 780px;
    }

    .eyebrow {
      margin: 0;
      color: var(--soft);
      font-size: 0.8rem;
      font-weight: 760;
      line-height: 1.35;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: 4.6rem;
      line-height: 1.03;
      font-weight: 760;
      letter-spacing: 0;
    }

    .lead {
      margin: 0;
      max-width: 680px;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.72;
      word-break: keep-all;
    }

    .blog-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-top: 8px;
      border-top: 1px solid var(--line-strong);
    }

    .source-links {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .source-link {
      width: 46px;
      height: 46px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #fff;
      transition: border-color 160ms ease, transform 160ms ease, background 160ms ease;
    }

    .source-link:hover,
    .source-link:focus-visible {
      border-color: rgba(0, 56, 118, 0.26);
      background: #fbfcff;
      transform: translateY(-1px);
      outline: none;
    }

    .source-link img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .blog-status {
      min-height: 22px;
      color: var(--soft);
      font-size: 0.86rem;
      font-weight: 620;
      line-height: 1.45;
    }

    .blog-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
    }

    .blog-card {
      min-height: 252px;
      display: grid;
      align-content: start;
      gap: 16px;
      padding: 26px;
      background: var(--surface);
      transition: background 160ms ease, transform 160ms ease;
    }

    .blog-card:hover,
    .blog-card:focus-visible {
      background: #fbfcff;
      transform: translateY(-2px);
      outline: none;
    }

    .blog-card__meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      color: var(--soft);
      font-size: 0.78rem;
      font-weight: 720;
      line-height: 1.35;
    }

    .blog-card__source {
      color: var(--yonsei);
    }

    .blog-card[data-source="Velog"] .blog-card__source {
      color: var(--velog);
    }

    .blog-card[data-source="Naver Blog"] .blog-card__source {
      color: var(--naver);
    }

    .blog-card__title {
      margin: 0;
      color: var(--ink);
      font-size: 1.22rem;
      font-weight: 740;
      line-height: 1.35;
      letter-spacing: 0;
      word-break: keep-all;
    }

    .blog-card__description {
      margin: 0;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.68;
      word-break: keep-all;
    }

    .blog-card--loading {
      color: var(--soft);
      font-size: 0.92rem;
      font-weight: 650;
    }

    @media (max-width: 920px) {
      h1 {
        font-size: 3.5rem;
      }

      .blog-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 680px) {
      main {
        padding: 58px 18px 88px;
      }

      .header-inner {
        width: min(100% - 28px, 1120px);
      }

      .nav {
        gap: 15px;
        overflow-x: auto;
      }

      h1 {
        font-size: 2.76rem;
      }

      .blog-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Go to home">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M3 10.7 12 3l9 7.7"></path>
          <path d="M5.5 9.8V21h13V9.8"></path>
        </svg>
      </a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="/about/">About</a>
        <a href="/research/">Research</a>
        <a href="/paper-publication/">Publication</a>
        <a href="/project/">Project</a>
        <a href="/blog/" aria-current="page">Blog</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="blog-shell">
      <section class="blog-hero" aria-labelledby="blog-title">
        <h1 id="blog-title">Blog</h1>
        <p class="lead">Writing Archive</p>
      </section>

      <section class="blog-toolbar" aria-label="Blog source links">
        <div class="source-links">
          <a class="source-link" href="https://velog.io/@hamzzi_lover" target="_blank" rel="noopener noreferrer" aria-label="Open Velog" title="Velog">
            <img src="/assets/icons/green favicon.png" alt="">
          </a>
          <a class="source-link" href="https://blog.naver.com/wowgiroong_715" target="_blank" rel="noopener noreferrer" aria-label="Open Naver Blog" title="Naver Blog">
            <img src="/assets/icons/naver_blog.png" alt="">
          </a>
        </div>
      </section>

      <p class="blog-status" id="blog-status">Loading posts...</p>

      <section class="blog-grid" id="blog-feed" aria-live="polite">
        <div class="blog-card blog-card--loading">Loading Velog and Naver Blog posts...</div>
      </section>
    </div>
  </main>

  <script src="/assets/js/blog-feed.js?v=20260729-1"></script>
</body>
</html>
