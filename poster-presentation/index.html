<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poster Presentations | Son Jiwon</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f4f7fb;
      --paper: #ffffff;
      --ink: #202632;
      --muted: #626d7c;
      --soft: #98a3b2;
      --line: #d7e1ee;
      --yonsei: #003876;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Noto Sans KR", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); text-rendering: optimizeLegibility; }
    a { color: inherit; text-decoration: none; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(245, 245, 247, 0.82);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      backdrop-filter: saturate(180%) blur(18px);
    }

    .header-inner {
      width: min(1120px, calc(100% - 44px));
      height: 48px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      width: 38px;
      height: 38px;
      display: inline-grid;
      place-items: center;
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 50%;
      background: #fff;
      color: var(--yonsei);
    }

    .brand svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
    .nav { display: flex; align-items: center; gap: 24px; color: #424245; font-size: 0.78rem; line-height: 1; white-space: nowrap; }
    .nav a { opacity: 0.92; transition: color 160ms ease, opacity 160ms ease; }
    .nav a[aria-current="page"], .nav a:hover, .nav a:focus-visible { color: var(--yonsei); opacity: 1; outline: none; }

    .nav-dropdown { position: relative; }
    .nav-dropdown-toggle { padding: 0; border: 0; background: transparent; color: var(--yonsei); font: inherit; cursor: pointer; }
    .nav-dropdown-toggle::after {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin: 0 0 3px 7px;
      border-top: 1.5px solid currentColor;
      border-right: 1.5px solid currentColor;
      content: "";
      transform: rotate(135deg);
      transition: transform 160ms ease;
    }

    .nav-dropdown-menu {
      position: absolute;
      top: calc(100% + 16px);
      left: -24px;
      z-index: 30;
      width: 210px;
      padding: 12px;
      display: grid;
      gap: 2px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background: #fff;
      box-shadow: 0 18px 45px rgba(0, 56, 118, 0.14);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      transition: opacity 160ms ease, transform 160ms ease, visibility 160ms ease;
    }

    .nav-dropdown-menu a { padding: 12px; color: #424245; font-size: 0.84rem; line-height: 1.3; white-space: normal; }
    .nav-dropdown-menu a:hover, .nav-dropdown-menu a:focus-visible { background: #f4f7fb; }
    .nav-dropdown:hover .nav-dropdown-menu, .nav-dropdown:focus-within .nav-dropdown-menu { opacity: 1; visibility: visible; transform: translateY(0); }
    .nav-dropdown:hover .nav-dropdown-toggle::after, .nav-dropdown:focus-within .nav-dropdown-toggle::after { transform: rotate(-45deg); }

    main { padding: 74px 22px 90px; }
    .page-shell { width: min(980px, 100%); margin: 0 auto; }
    .page-hero { display: grid; gap: 18px; margin-bottom: 42px; }
    .eyebrow { margin: 0; color: var(--soft); font-size: 0.8rem; font-weight: 760; line-height: 1.35; text-transform: uppercase; }
    h1 { margin: 0; color: var(--ink); font-size: 4.6rem; line-height: 1.03; font-weight: 760; }

    .year-tabs { display: flex; padding-top: 34px; border-top: 1px solid var(--line); }
    .year-tab {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border: 1px solid rgba(0, 56, 118, 0.22);
      border-radius: 999px;
      background: var(--yonsei);
      color: #fff;
      font-size: 0.92rem;
      font-weight: 720;
    }

    .year-panel { display: grid; gap: 18px; margin-top: 30px; }
    .year-heading { margin: 0; color: var(--soft); font-size: 0.86rem; font-weight: 760; line-height: 1.35; }
    .poster-placeholder { margin: 0; padding: 28px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--soft); font-size: 0.9rem; }

    @media (max-width: 560px) {
      .header-inner { width: min(100% - 28px, 1120px); }
      .nav { gap: 15px; }
      .nav-dropdown-menu { left: auto; right: -80px; }
      main { padding: 54px 18px 70px; }
      h1 { font-size: 2.76rem; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Go to home">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M3 10.7 12 3l9 7.7"></path>
          <path d="M5.5 9.8V21h13V9.8"></path>
        </svg>
      </a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="/about/">About</a>
        <div class="nav-dropdown">
          <button class="nav-dropdown-toggle" type="button" aria-haspopup="true" aria-current="page">Research</button>
          <div class="nav-dropdown-menu">
            <a href="/research/">Research Interests</a>
            <a href="/paper-publication/">Publications</a>
            <a href="/poster-presentation/" aria-current="page">Poster Presentations</a>
          </div>
        </div>
        <a href="/project/">Project</a>
        <a href="/blog/">Blog</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-shell">
      <section class="page-hero" aria-labelledby="poster-title">
        <p class="eyebrow">Research</p>
        <h1 id="poster-title">Poster Presentations</h1>
      </section>

      <nav class="year-tabs" aria-label="Poster presentations by year">
        <a class="year-tab" href="#posters-2026" aria-current="page">2026</a>
      </nav>

      <section class="year-panel" id="posters-2026" aria-labelledby="posters-2026-title">
        <h2 class="year-heading" id="posters-2026-title">2026</h2>
        <p class="poster-placeholder">5 poster presentations</p>
      </section>
    </div>
  </main>
</body>
</html>
