<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poster Presentation | Son Jiwon</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f4f7fb; --paper: #fff; --ink: #202632; --muted: #626d7c; --line: #d7e1ee; --yonsei: #003876;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Noto Sans KR", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); }
    a { color: inherit; text-decoration: none; }
    .site-header { position: sticky; top: 0; z-index: 20; background: rgba(245,245,247,.86); border-bottom: 1px solid rgba(0,0,0,.06); backdrop-filter: saturate(180%) blur(18px); }
    .header-inner { width: min(1120px, calc(100% - 44px)); height: 48px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .brand { color: var(--yonsei); font-size: .78rem; font-weight: 760; }
    .back-link { color: var(--yonsei); font-size: .82rem; font-weight: 720; }
    main { padding: 64px 22px 90px; }
    .detail-shell { width: min(900px, 100%); margin: 0 auto; }
    .detail-header { margin-bottom: 36px; }
    .conference { margin: 0 0 14px; color: var(--yonsei); font-size: .82rem; font-weight: 760; text-transform: uppercase; }
    h2 { margin: 0; color: var(--ink); font-size: clamp(1.25rem, 2.2vw, 1.5rem); font-weight: 720; line-height: 1.45; letter-spacing: -0.01em; }
    .presentation-details { margin-bottom: 36px; padding: 28px; border: 1px solid var(--line); background: var(--paper); }
    .details-heading, .content-heading, .visual-heading { margin: 0; color: var(--ink); font-size: 1rem; font-weight: 760; line-height: 1.45; }
    .details-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 28px; margin: 20px 0 0; }
    .details-grid div { min-width: 0; }
    .details-grid dt { margin: 0 0 5px; color: #8b96a4; font-size: .72rem; font-weight: 760; letter-spacing: .04em; text-transform: uppercase; }
    .details-grid dd { margin: 0; color: var(--muted); font-size: .88rem; line-height: 1.6; }
    .content-block { margin-top: 30px; }
    .content-block p { margin: 10px 0 0; color: var(--muted); font-size: .92rem; line-height: 1.75; }
    .content-block ul { display: grid; gap: 9px; margin: 12px 0 0; padding-left: 20px; color: var(--muted); font-size: .92rem; line-height: 1.7; }
    .visual-heading { margin-bottom: 14px; }
    .poster-frame { padding: 18px; border: 1px solid var(--line); background: var(--paper); box-shadow: 0 20px 55px rgba(0,56,118,.1); }
    .poster-frame img { width: 100%; height: auto; display: block; }
    @media (max-width: 560px) {
      main { padding: 42px 14px 70px; }
      .presentation-details { padding: 20px; }
      .details-grid { grid-template-columns: 1fr; gap: 14px; }
      .poster-frame { padding: 8px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">Son Jiwon</a>
      <a class="back-link" href="/poster-presentation/">← Poster Presentations</a>
    </div>
  </header>

  <main>
    <article class="detail-shell">
      <header class="detail-header">
        <p class="conference" id="poster-conference"></p>
        <h2 id="poster-title">Poster Presentation</h2>
      </header>
      <section class="presentation-details" id="presentation-details" aria-labelledby="details-title" hidden>
        <h3 class="details-heading" id="details-title">Presentation Details</h3>
        <dl class="details-grid" id="details-grid"></dl>
        <div class="content-block">
          <h3 class="content-heading">Overview</h3>
          <p id="poster-overview"></p>
        </div>
        <div class="content-block">
          <h3 class="content-heading">Key Findings</h3>
          <ul id="poster-findings"></ul>
        </div>
      </section>
      <h3 class="visual-heading" id="poster-visual-title" hidden>Poster</h3>
      <div class="poster-frame">
        <img id="poster-image" src="" alt="">
      </div>
    </article>
  </main>

  <script>
    const posters = {
      "cde-2026": {
        conference: "CDE 2026",
        title: "[CDE 2026] Comparative Evaluation of RDF-Based Ontology Representation Methods for Semantic Structuring of Progress Payment Documents in Reinforced Concrete Work",
        image: "/assets/posters/2026/cde-ontology.webp",
        details: {
          authors: "Jiwon Son, Insu Jung*",
          correspondingAuthor: "Insu Jung",
          event: "2026 Korea CDE Society Summer Conference",
          date: "August 19–22, 2026",
          location: "Jeju Booyoung Hotel & Resort, Jeju, Republic of Korea",
          type: "Poster Presentation",
          overview: "Construction progress payment information is distributed across multiple documents, making relationships and calculation evidence difficult to trace consistently. This study compares RDF-based ontology representation approaches for semantically structuring reinforced-concrete progress payment documents and supporting reliable cross-document information retrieval.",
          findings: [
            "Defined seven core classes covering documents, line items, work types, specifications, costs, evidence, and processes.",
            "Compared five representation approaches using SPARQL reference results and 30 natural-language queries evaluated through an LLM.",
            "RDF + RDFS + OWL 2 DL provided the most stable representation of document components and their relationships under the study's evaluation criteria."
          ]
        }
      },
      "ksce-2026": {
        conference: "KSCE 2026 Convention",
        title: "[KSCE 2026 Convention] A Knowledge Graph-Based Automation Framework for Construction Progress and Schedule Management",
        image: "/assets/posters/2026/knowledge-graph-schedule.webp",
        details: {
          authors: "Jiwon Son, Insu Jung, Hongjo Kim, Changjun Lee*",
          correspondingAuthor: "Changjun Lee",
          event: "KSCE 2026 Convention Conference & Civil Expo",
          date: "October 21–23, 2026",
          location: "High1 Resort, Gangwon, Republic of Korea",
          type: "Poster Presentation",
          overview: "Construction progress and schedule information is commonly dispersed across schedules, daily reports, site photographs, and meeting records. This study proposes a knowledge graph-based automation framework that connects planning, performance, evidence, delay causes, and response actions around a work breakdown structure.",
          findings: [
            "Structures heterogeneous progress-management documents as traceable entities and relationships centered on the WBS.",
            "Combines document collection, information extraction, WBS mapping, knowledge graph construction, and AI-agent utilization in a single workflow.",
            "Supports evidence-based progress calculation and delayed-activity assessment while reducing repetitive manual document review."
          ]
        }
      },
      "fi-rst-2026": {
        conference: "FI-RST 2026",
        title: "[FI-RST 2026] An Entity Matching-Based Modular Framework for Numerical Consistency Verification Across Heterogeneous Construction Progress Payment Documents",
        image: "/assets/posters/2026/fi-rst-consistency.webp"
      }
    };

    const key = new URLSearchParams(window.location.search).get("poster");
    const poster = posters[key] || posters["cde-2026"];
    document.title = `${poster.title} | Son Jiwon`;
    document.getElementById("poster-conference").textContent = poster.conference;
    document.getElementById("poster-title").textContent = poster.title;
    document.getElementById("poster-image").src = poster.image;
    document.getElementById("poster-image").alt = `${poster.conference} poster`;

    if (poster.details) {
      const detailItems = [
        ["Authors", poster.details.authors],
        ["Corresponding Author", poster.details.correspondingAuthor],
        ["Conference", poster.details.event],
        ["Date", poster.details.date],
        ["Location", poster.details.location],
        ["Type", poster.details.type]
      ];
      const detailsGrid = document.getElementById("details-grid");
      detailItems.forEach(([label, value]) => {
        const wrapper = document.createElement("div");
        const term = document.createElement("dt");
        const description = document.createElement("dd");
        term.textContent = label;
        description.textContent = value;
        wrapper.append(term, description);
        detailsGrid.appendChild(wrapper);
      });

      document.getElementById("poster-overview").textContent = poster.details.overview;
      const findings = document.getElementById("poster-findings");
      poster.details.findings.forEach((finding) => {
        const item = document.createElement("li");
        item.textContent = finding;
        findings.appendChild(item);
      });
      document.getElementById("presentation-details").hidden = false;
      document.getElementById("poster-visual-title").hidden = false;
    }
  </script>
</body>
</html>
