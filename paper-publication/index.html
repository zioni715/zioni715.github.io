<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publication | Son Jiwon</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f5f7;
      --surface: #ffffff;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --soft: #9aa3ad;
      --line: rgba(0, 0, 0, 0.08);
      --line-strong: rgba(0, 0, 0, 0.14);
      --yonsei: #003876;
      --kict: #f29a16;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Noto Sans KR", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(245, 245, 247, 0.82);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      backdrop-filter: saturate(180%) blur(18px);
    }

    .header-inner {
      width: min(1120px, calc(100% - 44px));
      height: 48px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      width: 38px;
      height: 38px;
      display: inline-grid;
      place-items: center;
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 50%;
      background: #fff;
      color: var(--yonsei);
      line-height: 1;
    }

    .brand svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 24px;
      color: #424245;
      font-size: 0.78rem;
      line-height: 1;
      white-space: nowrap;
    }

    .nav a {
      opacity: 0.92;
      transition: color 160ms ease, opacity 160ms ease;
    }

    .nav-dropdown {
      position: relative;
    }

    .nav-dropdown-toggle {
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    .nav-dropdown-toggle::after {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin: 0 0 3px 7px;
      border-top: 1.5px solid currentColor;
      border-right: 1.5px solid currentColor;
      content: "";
      transform: rotate(135deg);
      transition: transform 160ms ease;
    }

    .nav-dropdown-menu {
      position: absolute;
      top: calc(100% + 16px);
      left: -24px;
      z-index: 30;
      width: 210px;
      padding: 12px;
      display: grid;
      gap: 2px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background: #fff;
      box-shadow: 0 18px 45px rgba(0, 56, 118, 0.14);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      transition: opacity 160ms ease, transform 160ms ease, visibility 160ms ease;
    }

    .nav-dropdown-menu a {
      padding: 12px;
      color: #424245;
      font-size: 0.84rem;
      line-height: 1.3;
      white-space: normal;
    }

    .nav-dropdown-menu a:hover,
    .nav-dropdown-menu a:focus-visible {
      background: #f4f7fb;
    }

    .nav-dropdown:hover .nav-dropdown-menu,
    .nav-dropdown.is-open .nav-dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .nav-dropdown:hover .nav-dropdown-toggle::after,
    .nav-dropdown.is-open .nav-dropdown-toggle::after {
      transform: rotate(-45deg);
    }

    .nav a[aria-current="page"],
    .nav a:hover,
    .nav a:focus-visible {
      color: var(--yonsei);
      opacity: 1;
      outline: none;
    }

    main {
      padding: 82px 22px 110px;
    }

    .page-shell {
      width: min(1120px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 42px;
    }

    .page-hero {
      display: grid;
      gap: 18px;
      max-width: 900px;
    }

    .eyebrow {
      margin: 0;
      color: var(--soft);
      font-size: 0.8rem;
      font-weight: 760;
      line-height: 1.35;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: 4.6rem;
      line-height: 1.03;
      font-weight: 760;
      letter-spacing: 0;
    }

    .publication-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 34px;
      border-top: 1px solid var(--line-strong);
    }

    .publication-tab {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border: 1px solid rgba(0, 56, 118, 0.22);
      border-radius: 999px;
      background: #fff;
      color: var(--yonsei);
      font-size: 0.92rem;
      font-weight: 720;
      line-height: 1;
      transition: border-color 160ms ease, color 160ms ease, background 160ms ease;
    }

    .publication-tab[aria-current="page"],
    .publication-tab:hover,
    .publication-tab:focus-visible {
      border-color: rgba(0, 56, 118, 0.36);
      background: rgba(0, 56, 118, 0.06);
      color: var(--yonsei);
      outline: none;
    }

    .publication-section {
      scroll-margin-top: 76px;
    }

    .section-heading {
      margin: 0 0 22px;
      color: var(--yonsei);
      font-size: 1rem;
      font-weight: 760;
      text-transform: uppercase;
    }

    .publication-list {
      border-top: 1px solid var(--line-strong);
    }

    .publication-item {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      gap: 28px;
      padding: 30px 0;
      border-bottom: 1px solid var(--line);
    }

    .publication-year {
      color: var(--soft);
      font-size: .88rem;
      font-weight: 760;
    }

    .publication-content {
      min-width: 0;
    }

    .publication-content h2 {
      margin: 0;
      font-size: 1.22rem;
      font-weight: 740;
      line-height: 1.5;
      word-break: keep-all;
    }

    .publication-authors,
    .publication-venue {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: .94rem;
      line-height: 1.65;
    }

    .publication-link {
      display: inline-flex;
      align-items: center;
      margin-top: 18px;
      color: var(--yonsei);
      font-size: .82rem;
      font-weight: 740;
    }

    .publication-link::after {
      margin-left: 6px;
      content: "↗";
    }

    @media (max-width: 860px) {
      h1 {
        font-size: 3.5rem;
      }

    }

    @media (max-width: 680px) {
      main {
        padding: 58px 18px 88px;
      }

      .header-inner {
        width: min(100% - 28px, 1120px);
      }

      .nav {
        gap: 15px;
        overflow-x: auto;
      }

      h1 {
        font-size: 2.76rem;
      }

      .publication-item {
        grid-template-columns: 1fr;
        gap: 10px;
      }

    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Go to home">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M3 10.7 12 3l9 7.7"></path>
          <path d="M5.5 9.8V21h13V9.8"></path>
        </svg>
      </a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="/about/">About</a>
        <div class="nav-dropdown">
          <button class="nav-dropdown-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-current="page">Research</button>
          <div class="nav-dropdown-menu">
            <a href="/research/">Research Interests</a>
            <a href="/paper-publication/" aria-current="page">Publications</a>
            <a href="/oral-presentation/">Oral Presentations</a>
            <a href="/poster-presentation/">Poster Presentations</a>
          </div>
        </div>
        <a href="/project/">Project</a>
        <a href="/blog/">Blog</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-shell">
      <section class="page-hero" aria-labelledby="publication-title">
        <p class="eyebrow">Publication</p>
        <h1 id="publication-title">Publication</h1>
      </section>

      <nav class="publication-tabs" aria-label="Publication categories">
        <a class="publication-tab" href="#domestic" aria-current="page">Domestic</a>
        <a class="publication-tab" href="#international">International</a>
      </nav>

      <section class="publication-section" id="domestic" aria-labelledby="domestic-title">
        <h2 class="section-heading" id="domestic-title">Domestic Publications</h2>
        <div class="publication-list">
          <article class="publication-item">
            <div class="publication-year">2022</div>
            <div class="publication-content">
              <h2>고밀도 식당에서 바이러스 감염률 예측 모델을 이용한 환기 제안에 관한 연구</h2>
              <p class="publication-authors">오동근 · 정민철 · 조현상 · 손지원 · 이재우 · 김지민</p>
              <p class="publication-venue"><em>대한설비공학회 학술발표대회논문집</em>, 437–440</p>
              <a class="publication-link" href="https://www.dbpia.co.kr/pdf/pdfView.do?nodeId=NODE11194329" target="_blank" rel="noopener noreferrer" aria-label="논문 원문 새 창에서 보기">논문</a>
            </div>
          </article>
        </div>
      </section>
    </div>
  </main>
  <script src="/assets/js/navigation.js"></script>
</body>
</html>
